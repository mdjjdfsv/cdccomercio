<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - CDC Comércio</title>
    <!-- Importando a biblioteca do Supabase via CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        h2 { text-align: center; color: #333; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #2563eb; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 16px; }
        button:hover { background-color: #1d4ed8; }
        .hidden { display: none; }
        #mensagem { color: red; text-align: center; font-size: 14px; }
    </style>
</head>
<body>

    <!-- TELA DE LOGIN -->
    <div id="login-screen" class="card">
        <h2>Área Restrita</h2>
        <p id="mensagem"></p>
        <input type="email" id="email" placeholder="E-mail do Administrador">
        <input type="password" id="password" placeholder="Senha">
        <button onclick="fazerLogin()">Entrar</button>
    </div>

    <!-- TELA DO PAINEL (Oculta até o login) -->
    <div id="admin-screen" class="card hidden">
        <h2>Painel de Administração</h2>
        <p>Bem-vindo! Você está autenticado com sucesso.</p>
        <button onclick="fazerLogout()" style="background-color: #dc2626;">Sair (Logout)</button>
    </div>

    <script>
        // Credenciais configuradas do seu projeto Supabase
        const SUPABASE_URL = 'https://ufbxxfyhllndprwjctuk.supabase.co';
        const SUPABASE_ANON_KEY = 'sb_publishable_Udm_iff3YpLFrWkzukh7LQ_AcB7t30M';

        const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // Verificar se já existe um usuário logado ao abrir a página
        supabaseClient.auth.getSession().then(({ data: { session } }) => {
            if (session) {
                mostrarPainel();
            }
        });

        async function fazerLogin() {
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const mensagem = document.getElementById('mensagem');

            mensagem.textContent = "Entrando...";

            const { data, error } = await supabaseClient.auth.signInWithPassword({
                email: email,
                password: password,
            });

            if (error) {
                mensagem.textContent = "Erro ao entrar: " + error.message;
            } else {
                mostrarPainel();
            }
        }

        async function fazerLogout() {
            await supabaseClient.auth.signOut();
            document.getElementById('admin-screen').classList.add('hidden');
            document.getElementById('login-screen').classList.remove('hidden');
            document.getElementById('email').value = '';
            document.getElementById('password').value = '';
            document.getElementById('mensagem').textContent = '';
        }

        function mostrarPainel() {
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('admin-screen').classList.remove('hidden');
        }
    </script>
</body>
</html>
